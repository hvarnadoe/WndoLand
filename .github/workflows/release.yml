name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

# One release at a time so two quick merges can't compute the same version.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    # Add [skip release] to a commit message to merge without publishing.
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Compute next version
        id: version
        run: |
          # The latest v* tag is the source of truth; bump its patch number.
          latest=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          if [ -z "$latest" ]; then
            next="0.1.0"
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            next="$major.$minor.$((patch + 1))"
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "Next version: $next (previous: ${latest:-none})"

      - name: Publish
        run: >
          dotnet publish src/WndoLand/WndoLand.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -p:Version=${{ steps.version.outputs.version }}
          -o publish

      - name: Package
        run: |
          v="${{ steps.version.outputs.version }}"
          mkdir -p dist
          7z a "dist/WndoLand-$v-win-x64.zip" ./publish/*
          (cd dist && sha256sum "WndoLand-$v-win-x64.zip" > "WndoLand-$v-win-x64.zip.sha256")

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.version.outputs.version }}"
          gh release create "v$v" dist/* \
            --target "$GITHUB_SHA" \
            --title "WndoLand v$v" \
            --generate-notes
