name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

# One release at a time so two quick merges can't compute the same version.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    # Add [skip release] to a commit message to merge without publishing.
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Compute next version
        id: version
        run: |
          # The latest v* tag is the source of truth; bump its patch number.
          latest=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          if [ -z "$latest" ]; then
            next="0.1.0"
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            next="$major.$minor.$((patch + 1))"
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "Next version: $next (previous: ${latest:-none})"

      - name: Install vpk
        run: |
          dotnet tool install -g vpk --version 1.2.161
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Publish
        run: >
          dotnet publish src/WndoLand/WndoLand.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -p:Version=${{ steps.version.outputs.version }}
          -o publish

      - name: Fetch previous release
        # Lets vpk build small delta packages. The first release has nothing to fetch.
        run: |
          vpk download github \
            --repoUrl "https://github.com/${{ github.repository }}" \
            --token "${{ github.token }}" \
            --outputDir releases || echo "No previous release to download"

      - name: Pack
        run: |
          vpk pack \
            --packId WndoLandApp \
            --packTitle WndoLand \
            --packAuthors WndoLand \
            --packVersion "${{ steps.version.outputs.version }}" \
            --packDir publish \
            --mainExe WndoLand.exe \
            --icon src/WndoLand/Assets/wndoland.ico \
            --outputDir releases

      - name: Upload release
        run: |
          v="${{ steps.version.outputs.version }}"
          vpk upload github \
            --repoUrl "https://github.com/${{ github.repository }}" \
            --token "${{ github.token }}" \
            --outputDir releases \
            --publish \
            --tag "v$v" \
            --releaseName "WndoLand v$v" \
            --targetCommitish "$GITHUB_SHA"

      - name: Prune old releases
        # Keep the 3 newest releases; delete the rest along with their tags.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "${{ github.repository }}" --limit 100 \
            --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[3:] | .[].tagName' |
          while read -r tag; do
            echo "Deleting release $tag"
            gh release delete "$tag" --repo "${{ github.repository }}" --yes --cleanup-tag
          done
